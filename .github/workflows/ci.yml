name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  # ── web-backend: TypeScript lint + type check ─────────────────────────────
  web-backend-lint:
    name: web-backend / lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

  # ── web-backend: Jest tests ───────────────────────────────────────────────
  web-backend-test:
    name: web-backend / tests
    runs-on: ubuntu-latest
    needs: web-backend-lint
    defaults:
      run:
        working-directory: web-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: web-backend

  # ── processing-service: Python lint + type check ──────────────────────────
  processing-lint:
    name: processing-service / lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processing-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: processing-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: mypy type check
        run: mypy app/

  # ── processing-service: pytest ────────────────────────────────────────────
  processing-test:
    name: processing-service / tests
    runs-on: ubuntu-latest
    needs: processing-lint
    defaults:
      run:
        working-directory: processing-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: processing-service/requirements.txt

      - name: Install system deps (GDAL for rasterio)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev libgeos-dev libgl1-mesa-glx

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run pytest with coverage
        env:
          ENV: test
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: orbitlens-test
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          INTERNAL_API_KEY: ci-internal-key-32-chars-minimum!!
          WEB_BACKEND_CALLBACK_URL: http://localhost:5000/api/v1/jobs/callback
          WEB_BACKEND_CALLBACK_KEY: ci-internal-key-32-chars-minimum!!
        run: |
          pytest tests/ -v --tb=short --co -q
          pytest tests/ -v --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: processing-service

  # ── Docker build smoke test ───────────────────────────────────────────────
  docker-build:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: [web-backend-lint, processing-lint]
    defaults:
      run:
        working-directory: processing-service

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (processing-service)
        run: docker build -t orbitlens-processing:ci .
