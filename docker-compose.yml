version: "3.9"

# ── Local development infrastructure ──────────────────────────────────────────
# Provides Redis (job queue) and MinIO (S3-compatible object storage).
# Both services share the same network so web-backend and processing-service
# can reach them by hostname.
#
# Usage:
#   docker compose up -d          # start in background
#   docker compose down -v        # stop and remove volumes
#
# MinIO console: http://localhost:9001  (user: minioadmin / pass: minioadmin)
# Redis:         localhost:6379

services:
  redis:
    image: redis:7-alpine
    container_name: orbitlens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: orbitlens-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Init container — creates the default bucket on first run then exits.
  create-buckets:
    image: minio/mc:latest
    container_name: orbitlens-create-buckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/orbitlens-imagery;
        mc mb --ignore-existing local/orbitlens-models;
        echo 'Buckets ready.';
      "
    restart: "no"

volumes:
  redis_data:
  minio_data:
