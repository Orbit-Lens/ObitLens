[mypy]
python_version = 3.12
strict = True
warn_return_any = True
warn_unused_configs = True
no_implicit_reexport = True

# Ignore missing stubs for third-party libs that don't ship them
[mypy-cv2.*]
ignore_missing_imports = True

[mypy-rasterio.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-kornia.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-sentry_sdk.*]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True
